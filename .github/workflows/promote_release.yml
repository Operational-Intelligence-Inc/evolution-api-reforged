name: Promote release

# Promotes a pre-release published by publish_prod_image.yml, once it has been checked (on staging, for instance):
# points `<major>.<minor>` and `latest` at its image, the same digest with no rebuild, and marks its GitHub Release as
# the latest release. Refuses a version that has no release, is already promoted, or is older than the latest release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote (e.g. 3.4.0)
        required: true
        type: string

# Shared with publish_prod_image.yml, so a promotion never runs while a pre-release is being published.
concurrency:
  group: publish-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check the pre-release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a MAJOR.MINOR.PATCH version"
            exit 1
          fi

          if ! prerelease=$(gh release view "v$version" --repo "$REPO" --json isPrerelease -q .isPrerelease); then
            echo "::error::There is no GitHub Release v$version. Merging into prod publishes it as a pre-release."
            exit 1
          fi
          if [[ "$prerelease" != "true" ]]; then
            echo "::error::v$version is already promoted."
            exit 1
          fi

          # Without a tag, `gh release view` shows the latest release. Never move `latest` back to an older version.
          current=$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)
          current="${current#v}"
          if [[ -n "$current" && "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "::error::v$version is older than the latest release, v$current."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the floating tags at the image
        env:
          IMAGE: ${{ steps.check.outputs.image }}
          VERSION: ${{ steps.check.outputs.version }}
          MINOR: ${{ steps.check.outputs.minor }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$MINOR" --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:latest"

      - name: Mark the GitHub Release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$REPO" --prerelease=false --latest
